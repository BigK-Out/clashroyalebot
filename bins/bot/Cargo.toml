[package]
name = "bot"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
brain = { version = "0.1.0", path = "../../crates/brain" }
calib = { version = "0.1.0", path = "../../crates/calib" }
capture = { version = "0.1.0", path = "../../crates/capture" }
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
input = { version = "0.1.0", path = "../../crates/input" }
state = { version = "0.1.0", path = "../../crates/state" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vision = { version = "0.1.0", path = "../../crates/vision" }
